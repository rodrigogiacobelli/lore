# Which skills a release ships, which blocks each skill file is assembled from,
# the two instruction documents, the explicit line-cap exceptions, and where
# every retired skill went.
#
# A sibling of agents.yaml at the defaults/ root rather than inside skills/.
# A skill is installed when at least one body block of its SKILL.md survives
# the project's profile; the head block (frontmatter) never counts. A reference
# file is written when at least one of its blocks survives and its skill is
# installed.
#
# `legacy_families` is the retired family model: the deprecated --skills alias
# and the migration of an older project read it. `retired` is append-only; a
# project hopping several releases needs every intermediate rename explained,
# and `reason` is quoted verbatim in the removal report.

version: 3
legacy_families:
  memory:
    description: "Project memory \u2014 codex, rites and glossary"
    features:
    - memory
    skills:
    - retrieve-memory
    - store-memory
  machinery:
    description: Lore's own configuration entities
    features:
    - doctrines
    - artifacts
    - watchers
    skills:
    - update-artifact
    - update-custom-schema
    - update-doctrine
    - update-index
    - update-watcher
  workflow:
    description: Multi-step processes over quests and missions
    features:
    - quests
    skills:
    - inquest
    - start-quest
    - sync-codex-guide
