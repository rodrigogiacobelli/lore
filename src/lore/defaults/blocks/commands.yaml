# The command-grant table: every `lore` command phrase a block may contain,
# and the conditions under which it may. A phrase is permitted when ANY of its
# grants holds. A block may declare a phrase only when its own tags imply one
# of its grants (lint L2). Conditions use the block gate grammar.
#
# `lore health` is core and always granted (cap:validate); the Memory scopes
# follow Memory and the opt-in that owns them. `memory.cli` reads "Memory is on
# and agents use the Lore CLI"; the search, index and graph rows need the
# opt-in whatever the route.
commands:
  "--help": [cap:validate]
  "--version": [cap:validate]
  "--json": [cap:validate]
  "init": [cap:validate]
  "codex list": [memory.cli]
  "codex show": [memory.cli]
  "codex new": [memory.cli]
  "codex edit": [memory.cli]
  "codex delete": [memory.cli]
  "codex search": [cap:memory-search]
  "rite list": [memory.cli]
  "rite show": [memory.cli]
  "rite new": [memory.cli]
  "rite edit": [memory.cli]
  "rite delete": [memory.cli]
  "rite search": [cap:memory-search]
  "glossary list": [memory.cli]
  "glossary show": [memory.cli]
  "glossary new": [memory.cli]
  "glossary edit": [memory.cli]
  "glossary delete": [memory.cli]
  "glossary search": [cap:memory-search]
  "codex map": [cap:memory-graph]
  "codex chaos": [cap:memory-graph]
  "impacts": [cap:memory-graph]
  "index search": [cap:memory-index]
  "index build": [cap:memory-index]
  "health": [cap:validate]
  "health --scope codex": [memory]
  "health --scope rites": [memory]
  "health --scope glossary": [memory]
  "health --scope voice": [memory]
  "health --scope bindings": [cap:memory-graph]
  "health --scope index": [cap:memory-index]
  "health --scope doctrines": [cap:validate]
  "health --scope artifacts": [cap:validate]
  "health --scope watchers": [watchers]
  "health --scope schemas": [cap:validate]
  "health --scope skills": [cap:validate]
  "doctrine list": [doctrines.cli]
  "doctrine show": [doctrines.cli]
  "doctrine new": [doctrines.cli]
  "doctrine edit": [doctrines.cli]
  "doctrine delete": [doctrines.cli]
  "artifact list": [artifacts.cli]
  "artifact show": [artifacts.cli]
  "artifact new": [artifacts.cli]
  "artifact edit": [artifacts.cli]
  "artifact delete": [artifacts.cli]
  "watcher list": [watchers.cli]
  "watcher show": [watchers.cli]
  "watcher new": [watchers.cli]
  "watcher edit": [watchers.cli]
  "watcher delete": [watchers.cli]
  "new": [quests]
  "claim": [quests]
  "done": [quests]
  "block": [quests]
  "unblock": [quests]
  "ready": [quests]
  "needs": [quests]
  "unneed": [quests]
  "list": [quests]
  "missions": [quests]
  "show": [quests]
  "stats": [quests]
  "oracle": [quests]
  "board add": [quests]
  "board delete": [quests]
