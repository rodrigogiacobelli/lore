$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "lore://schemas/codex-frontmatter"
title: Codex Frontmatter
type: object
additionalProperties: false
required: [id, title, summary]
properties:
  id:
    type: string
    minLength: 1
    description: Codex document id. Must be globally unique across the codex.
  title:
    type: string
    minLength: 1
  summary:
    type: string
    minLength: 1
  type:
    type: string
    description: >
      Optional free-form label (e.g. tech-spec, tech-spec-amendment). Not a
      schema selector — codex doc_type is resolved from path/group.
  related:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: >
      Optional. MUST be a YAML array (flow `[a, b]` or block dash-list `- a`).
      A mapping is NOT allowed here — each entry is a codex id string.
  binds:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
      not:
        anyOf:
          - { pattern: '^/' }
          - { pattern: '(^|/)\.\.(/|$)' }
    description: >
      Optional. List of repo-root-relative paths or globs (recursive **
      supported) governed by this codex entry. Empty list and missing
      field behave identically (FR-4).
  rites:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: >
      Optional. List of rite ids governed by this codex entry. Plain
      slugs (no path-pattern rules). Empty list and missing field behave
      identically.
