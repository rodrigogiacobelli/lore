$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "lore://schemas/block-commands"
title: Block command grants
description: >-
  The command-grant table: every `lore` command phrase a block may contain and
  the conditions under which it may. A phrase is permitted when any one of its
  grants holds. Shipped as package data
  (src/lore/defaults/blocks/commands.yaml), never overlayable.
type: object
additionalProperties: false
required: [commands]
properties:
  commands:
    type: object
    minProperties: 1
    propertyNames: {minLength: 1}
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
